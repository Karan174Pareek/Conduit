name: Conduit CI

on:
  push:
    branches: [main, 'phase-*', 'fix/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Test, Build & Helm Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Build Packages & Apps
        run: npm run build

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm Lint
        run: |
          helm lint charts/conduit
          helm lint charts/woocommerce-store

      - name: Helm Template (Local & Prod Values)
        run: |
          helm template conduit charts/conduit -f values/values-local.yaml > /dev/null
          helm template conduit charts/conduit -f values/values-prod.yaml > /dev/null
          helm template store charts/woocommerce-store -f values/values-local.yaml > /dev/null
          helm template store charts/woocommerce-store -f values/values-prod.yaml > /dev/null

  security-scan:
    name: Security & Secret Scan (Gitleaks & Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trivy filesystem scan: checks repository files for secrets and misconfigurations (Helm/K8s/Docker).
      # Severity policy: Fail CI build (exit-code: 1) strictly on CRITICAL and HIGH findings to block
      # high-impact exploits, leaky credentials, and misconfigured infrastructure templates.
      # MEDIUM, LOW, and UNKNOWN findings are reported in the summary table for awareness without
      # breaking the pipeline to avoid noisy, non-actionable blocking delays.
      - name: Trivy Vulnerability, Secret & Misconfig Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          scanners: 'misconfig,secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

name: Conduit CI

on:
  push:
    branches: [main, 'phase-*', 'fix/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Test, Audit & Helm Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Production Dependency Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Unit & Integration Tests (Throwaway Containerized Mongo)
        run: npm run test

      - name: Build Packages & Apps
        run: npm run build

      - name: Setup Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.16.2

      - name: Helm Lint
        run: |
          helm lint charts/conduit
          helm lint charts/woocommerce-store

      - name: Helm Template (Local & Prod Values)
        run: |
          helm template conduit charts/conduit -f values/values-local.yaml > /dev/null
          helm template conduit charts/conduit -f values/values-prod.yaml > /dev/null
          helm template store charts/woocommerce-store -f values/values-local.yaml > /dev/null
          helm template store charts/woocommerce-store -f values/values-prod.yaml > /dev/null

      - name: Setup Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin kubeconform

      - name: Kubeconform Schema Validation
        run: |
          helm template conduit charts/conduit -f values/values-prod.yaml | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0
          helm template store charts/woocommerce-store -f values/values-prod.yaml | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0

      - name: Generate CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file conduit-sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: conduit-cyclonedx-sbom
          path: conduit-sbom.json

  security-scan:
    name: Security Scans (Gitleaks & Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code (Full History for Gitleaks)
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner (Full History)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Filesystem Scan (Vuln, Misconfig, Secret)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          scanners: 'vuln,misconfig,secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: '.trivyignore.yaml'

      - name: Build All Microservice Docker Images
        run: |
          docker build -t conduit/gateway:ci -f apps/gateway/Dockerfile .
          docker build -t conduit/dashboard:ci -f apps/dashboard/Dockerfile .
          docker build -t conduit/notes-mcp:ci -f apps/notes-mcp/Dockerfile .
          docker build -t conduit/utils-mcp:ci -f apps/utils-mcp/Dockerfile .
          docker build -t conduit/woo-mcp:ci -f apps/woo-mcp/Dockerfile .

      - name: Trivy Gateway Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'conduit/gateway:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Trivy Dashboard Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'conduit/dashboard:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

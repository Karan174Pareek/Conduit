{{- if and .Values.backup .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-mariadb-backup
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb-backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.className | default "local-path" }}
  resources:
    requests:
      storage: {{ .Values.storage.mariadbBackupSize | default "2Gi" }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-wordpress
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      {{- include "woocommerce-store.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wordpress
  template:
    metadata:
      labels:
        {{- include "woocommerce-store.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: wordpress
    spec:
      automountServiceAccountToken: false
      # Documented Security Exception (SECURITY.md §7):
      # The official WordPress Apache image begins as root to bind port 80 and immediately
      # drops to www-data (UID 33). Mitigations: seccomp RuntimeDefault, allowPrivilegeEscalation false,
      # drop ALL capabilities adding only minimal set (CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE),
      # automountServiceAccountToken disabled, and network isolation via NetworkPolicy.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wordpress
          image: "{{ .Values.images.wordpress | default "conduit/wordpress:6.7.2-wc9.6.2" }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
                - DAC_OVERRIDE
          ports:
            - containerPort: 80
              name: http
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ include "woocommerce-store.mariadbHost" . }}:3306"
            - name: WORDPRESS_DB_NAME
              value: "wordpress"
            - name: WORDPRESS_DB_USER
              value: "wordpress"
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingStoreSecret }}
                  key: MARIADB_PASSWORD
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', '{{ include "woocommerce-store.shopUrl" . }}');
                define('WP_SITEURL', '{{ include "woocommerce-store.shopUrl" . }}');
                define('FORCE_SSL_ADMIN', false);
          startupProbe:
            httpGet:
              path: /wp-login.php
              port: 80
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: {{ include "woocommerce-store.fullname" . }}-wp-content

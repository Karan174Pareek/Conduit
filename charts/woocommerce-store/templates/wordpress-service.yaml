apiVersion: v1
kind: Service
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-wordpress
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    {{- include "woocommerce-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress

global:
  domain: localhost
  publicPort: 80

images:
  pullPolicy: IfNotPresent
  # Documented Security Exception (SECURITY.md §7):
  # The official WordPress (Apache) image starts as root to bind port 80 and setuid to www-data (UID 33).
  # Mitigations: drop all capabilities except minimal set (CHOWN, FOWNER, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE),
  # seccomp RuntimeDefault, readOnlyRootFilesystem with tmpfs mounts, automountServiceAccountToken disabled,
  # default-deny NetworkPolicy, and baseline Pod Security. Scoped Trivy rule DS-0002 ignore documented in .trivyignore.yaml.
  wordpress: conduit/wordpress:6.7.2-wc9.6.2
  mariadb: mariadb:11.4.5
  wooMcp: conduit/woo-mcp:latest

storage:
  className: local-path
  mariadbSize: 5Gi
  wpContentSize: 2Gi

secrets:
  existingStoreSecret: store-secrets

ingress:
  className: traefik
  tls:
    enabled: false
    clusterIssuer: letsencrypt-prod

networkPolicy:
  enabled: true

wooMcp:
  replicas: 1
  timezone: Asia/Kolkata
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 192Mi

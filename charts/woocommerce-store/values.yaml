global:
  domain: localhost
  publicPort: 80

images:
  pullPolicy: IfNotPresent
  wordpress: conduit/wordpress:latest
  mariadb: mariadb:11.4
  wooMcp: conduit/woo-mcp:latest

storage:
  className: local-path
  mariadbSize: 5Gi
  wpContentSize: 2Gi

secrets:
  existingStoreSecret: store-secrets

networkPolicy:
  enabled: true

{{- if and .Values.backup .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "conduit.fullname" . }}-mongodb-backup
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb-backup
spec:
  schedule: {{ .Values.backup.mongoSchedule | default "0 2 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "conduit.labels" . | nindent 12 }}
            app.kubernetes.io/component: mongodb-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mongodump
              image: mongo:7
              imagePullPolicy: {{ .Values.images.pullPolicy | default "IfNotPresent" }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d%H%M%S)
                  BACKUP_FILE="/backups/mongo-${TIMESTAMP}.dump.gz"
                  echo "Waiting up to 60s for MongoDB to become reachable (kube-router netpol delay)..."
                  CONNECTED=0
                  for i in $(seq 1 30); do
                    if mongosh --host="{{ include "conduit.fullname" . }}-mongodb:27017" \
                               --username="$MONGO_INITDB_ROOT_USERNAME" \
                               --password="$MONGO_INITDB_ROOT_PASSWORD" \
                               --authenticationDatabase=admin \
                               --eval "db.adminCommand('ping')" \
                               --quiet >/dev/null 2>&1; then
                      echo "MongoDB is reachable after attempt ${i}."
                      CONNECTED=1
                      break
                    fi
                    sleep 2
                  done
                  if [ "$CONNECTED" -ne 1 ]; then
                    echo "ERROR: Timed out waiting for MongoDB connectivity"
                    exit 1
                  fi
                  echo "Starting mongodump to ${BACKUP_FILE}..."
                  timeout 60 mongodump --host="{{ include "conduit.fullname" . }}-mongodb:27017" \
                            --username="$MONGO_INITDB_ROOT_USERNAME" \
                            --password="$MONGO_INITDB_ROOT_PASSWORD" \
                            --authenticationDatabase=admin \
                            --archive="${BACKUP_FILE}" \
                            --gzip
                  echo "Backup successfully completed: $(ls -lh ${BACKUP_FILE})"
                  # Keep latest 7 backups
                  ls -t /backups/mongo-*.dump.gz | tail -n +8 | xargs -r rm --
                  echo "Retention cleanup complete."
              env:
                - name: MONGO_INITDB_ROOT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingConduitSecret }}
                      key: MONGO_ROOT_USER
                - name: MONGO_INITDB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingConduitSecret }}
                      key: MONGO_ROOT_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: {{ include "conduit.fullname" . }}-mongodb-backup
{{- end }}
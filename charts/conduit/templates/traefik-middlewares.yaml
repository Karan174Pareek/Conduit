{{- if .Values.ingress.tls.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "conduit.fullname" . }}-redirect-https
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "conduit.fullname" . }}-hsts-headers
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
spec:
  headers:
    sslRedirect: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    browserXssFilter: true
    contentTypeNosniff: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "conduit.fullname" . }}-auth-ratelimit
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: 10
    burst: 20
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "conduit.fullname" . }}-mcp-bodysize
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: 1048576
{{- end }}

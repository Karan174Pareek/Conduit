{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "conduit.fullname" . }}-default-deny
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "conduit.fullname" . }}-gateway
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from Ingress controller (Traefik in kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow MongoDB to conduit-mongodb in the same namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "conduit.name" . }}-mongodb
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 27017
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow MCP requests to woo-mcp in store-default namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store-default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: woocommerce-store-woo-mcp
      ports:
        - protocol: TCP
          port: 3100
    # Allow MCP requests to demo MCP servers (notes, utils, etc)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: demo-mcp
      ports:
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 3201
    # Allow HTTPS egress to internet (Gemini API)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "conduit.fullname" . }}-mongodb
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "conduit.name" . }}-mongodb
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow MongoDB from gateway pod and backup cronjob pod
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mongodb-backup
      ports:
        - protocol: TCP
          port: 27017
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "conduit.fullname" . }}-dashboard
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/component: dashboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from Ingress controller (Traefik in kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress: [] # Static asset server requires zero egress
{{- if and .Values.backup .Values.backup.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "conduit.fullname" . }}-mongodb-backup
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb-backup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mongodb-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "conduit.name" . }}-mongodb
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 27017
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}


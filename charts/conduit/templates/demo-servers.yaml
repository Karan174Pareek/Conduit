{{- if .Values.demoServers }}
{{- if .Values.demoServers.notes.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conduit.fullname" . }}-demo-notes-mcp
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
    app.kubernetes.io/name: demo-notes-mcp
    app.kubernetes.io/part-of: demo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-notes-mcp
  template:
    metadata:
      labels:
        {{- include "conduit.labels" . | nindent 8 }}
        app.kubernetes.io/name: demo-notes-mcp
        app.kubernetes.io/part-of: demo-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-notes-mcp
          image: "{{ .Values.images.repository }}/demo-notes-mcp:{{ .Values.images.tag | default .Chart.AppVersion | default "latest" }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 3200
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-notes-mcp
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
    app.kubernetes.io/name: demo-notes-mcp
    app.kubernetes.io/part-of: demo-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demo-notes-mcp
  ports:
    - name: http
      port: 3200
      targetPort: 3200
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "conduit.fullname" . }}-demo-notes-mcp
  namespace: conduit-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-notes-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 3200
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

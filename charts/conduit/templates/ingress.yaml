apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "conduit.fullname" . }}-gateway
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/service.serverstransport: conduit-system-{{ include "conduit.fullname" . }}-gateway-transport@kubernetescrd
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | default "letsencrypt-prod" }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "traefik" }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - "gateway.{{ .Values.global.domain }}"
        - "dashboard.{{ .Values.global.domain }}"
      secretName: {{ include "conduit.fullname" . }}-gateway-tls
  {{- end }}
  rules:
    - host: "gateway.{{ .Values.global.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: conduit-gateway
                port:
                  number: 3000
    - host: "dashboard.{{ .Values.global.domain }}"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: conduit-gateway
                port:
                  number: 3000
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ include "conduit.fullname" . }}-gateway-transport
  namespace: conduit-system
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
spec:
  forwardingTimeouts:
    dialTimeout: 10s
    responseHeaderTimeout: 120s
    readIdleTimeout: 120s
